name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  quality:
    name: Lint, tipos, formatação, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: Testes ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e -- --trace off
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    name: Banco de dados (Supabase local efêmero)
    # ADR 0007: o CI é o ambiente oficial dos testes de banco. Nenhum projeto
    # remoto é usado; o Supabase sobe em containers descartados ao fim do job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      - name: Subir Supabase local
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor
      - name: Verificar serviços
        run: supabase status -o env | grep -E '^(API_URL|DB_URL)=' | sed -E 's#(://[^:]+:)[^@]+@#\1***@#'
      - name: Reaplicar banco do zero (somente migrations)
        run: supabase db reset --no-seed
      - name: Lint do schema
        run: supabase db lint --level warning --fail-on error
      - name: Testes de banco (pgTAP)
        run: supabase test db
      - name: Simulado de backup e restauração (dados fictícios)
        run: bash scripts/db/backup-restore-drill.sh
      - name: Encerrar
        if: always()
        run: supabase stop --no-backup

  auth-e2e:
    name: Autenticação /admin com MFA (Supabase local efêmero)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      - run: npm ci
      - name: Subir Supabase local
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor
      - name: Exportar chaves efêmeras (mascaradas)
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          # Chave do cofre fictícia, gerada a cada execução (nenhum valor versionado).
          VAULT_MASTER_KEY="$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
          for value in "$ANON_KEY" "$SERVICE_ROLE_KEY" "$DB_URL" "$VAULT_MASTER_KEY"; do echo "::add-mask::$value"; done
          {
            echo "NEXT_PUBLIC_APP_ENV=development"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3100"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "VAULT_MASTER_KEY=$VAULT_MASTER_KEY"
            echo "VAULT_MASTER_KEY_VERSION=1"
          } >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test -c playwright.auth.config.ts --trace off
      - name: Bootstrap da primeira administradora (idempotência e recusas)
        run: |
          set -euo pipefail
          EMAIL="bootstrap.ci.$(date +%s)@exemplo.test"
          first="$(npm run -s admin:bootstrap -- --email "$EMAIL")"; echo "$first"
          echo "$first" | grep -q 'RESULT=invited'
          second="$(npm run -s admin:bootstrap -- --email "$EMAIL")"; echo "$second"
          echo "$second" | grep -q 'RESULT=already-admin'
          count="$(psql "$SUPABASE_DB_URL" -X -A -t -c "select count(*) from public.user_roles ur join auth.users u on u.id = ur.user_id where u.email = '$EMAIL' and ur.role_key = 'admin'")"
          test "$count" = "1"
          audit="$(psql "$SUPABASE_DB_URL" -X -A -t -c "select count(*) from public.audit_logs where action = 'bootstrap.admin'")"
          test "$audit" -ge 1
          # Recusas: produção sem confirmação, e-mail inválido, ambiente de deploy.
          if NEXT_PUBLIC_APP_ENV=production npm run -s admin:bootstrap -- --email "$EMAIL"; then exit 1; fi
          if npm run -s admin:bootstrap -- --email "nao-e-email"; then exit 1; fi
          if VERCEL=1 npm run -s admin:bootstrap -- --email "$EMAIL"; then exit 1; fi
          echo "Bootstrap idempotente e protegido."
      - name: Encerrar
        if: always()
        run: supabase stop --no-backup

  secrets:
    name: Varredura de segredos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instalar Gitleaks (com verificação de checksum)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${file}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "${file}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Autoteste — a configuração detecta um segredo fictício
        run: |
          set -uo pipefail
          tmp="$(mktemp -d)"
          # Gerado em tempo de execução: nenhum valor parecido com segredo fica versionado.
          printf 'SUPABASE_KEY=sb_secret_%s\n' "$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)" > "${tmp}/fake.env"
          if gitleaks dir "${tmp}" --config .gitleaks.toml --no-banner --redact; then
            echo "::error::A configuração do Gitleaks não detectou o segredo fictício."
            exit 1
          fi
          echo "Autoteste OK: segredo fictício detectado."
      - name: Varredura de todo o histórico
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact --verbose
