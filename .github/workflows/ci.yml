name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  quality:
    name: Lint, tipos, formatação, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: Testes ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e -- --trace off
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    name: Banco de dados (Supabase local efêmero)
    # ADR 0007: o CI é o ambiente oficial dos testes de banco. Nenhum projeto
    # remoto é usado; o Supabase sobe em containers descartados ao fim do job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      - name: Subir Supabase local
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor
      - name: Verificar serviços
        run: supabase status -o env | grep -E '^(API_URL|DB_URL)=' | sed -E 's#(://[^:]+:)[^@]+@#\1***@#'
      - name: Reaplicar banco do zero (migrations e seeds)
        run: supabase db reset
      - name: Lint do schema
        run: supabase db lint --level warning --fail-on error
      - name: Testes de banco (pgTAP)
        run: |
          if [ -d supabase/tests ] && find supabase/tests -name "*.sql" | grep -q .; then
            supabase test db
          else
            echo "Nenhum teste de banco ainda (M1 adicionará os testes pgTAP)."
          fi
      - name: Encerrar
        if: always()
        run: supabase stop --no-backup

  secrets:
    name: Varredura de segredos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instalar Gitleaks (com verificação de checksum)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${file}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "${file}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Autoteste — a configuração detecta um segredo fictício
        run: |
          set -uo pipefail
          tmp="$(mktemp -d)"
          # Gerado em tempo de execução: nenhum valor parecido com segredo fica versionado.
          printf 'SUPABASE_KEY=sb_secret_%s\n' "$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)" > "${tmp}/fake.env"
          if gitleaks dir "${tmp}" --config .gitleaks.toml --no-banner --redact; then
            echo "::error::A configuração do Gitleaks não detectou o segredo fictício."
            exit 1
          fi
          echo "Autoteste OK: segredo fictício detectado."
      - name: Varredura de todo o histórico
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact --verbose
